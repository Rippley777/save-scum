name: Save Scum static website
on:
  push:
    branches: [main]
    paths: ["website/**", ".github/workflows/website.yml"]
  pull_request:
    branches: [main]
    paths: ["website/**", ".github/workflows/website.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    env:
      ASTRO_TELEMETRY_DISABLED: "1"
      PUBLIC_HOUSE_EDGE_PROJECT: ${{ vars.PUBLIC_HOUSE_EDGE_PROJECT }}
      PUBLIC_HOUSE_EDGE_KEY: ${{ vars.PUBLIC_HOUSE_EDGE_KEY }}
      PUBLIC_HOUSE_EDGE_ENDPOINT: ${{ vars.PUBLIC_HOUSE_EDGE_ENDPOINT }}
      SITE_ENV: ${{ github.event_name == 'pull_request' && 'preview' || 'production' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - uses: actions/upload-artifact@v4
        with:
          name: save-scum-static-site
          path: website/dist
  deploy:
    needs: build
    if: vars.DEPLOY_SAVE_SCUM_WEBSITE == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: save-scum-static-site
          path: website/dist
      - uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: website/dist
          api_location: ""
          output_location: ""
          skip_app_build: true
          skip_api_build: true
