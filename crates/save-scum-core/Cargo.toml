[package]
license-file = "../../LICENSE"
name = "save-scum-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.90"

[dependencies]
anyhow = "1"
blake3 = "1"
chrono = { version = "0.4", features = ["serde"] }
directories = "6"
glob = "0.3"
fs2 = "0.4"
filetime = "0.2"
notify = "8"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.33"
tar = "0.4"
tempfile = "3"
uuid = { version = "1", features = ["v4"] }
walkdir = "2"
zstd = "0.13"
